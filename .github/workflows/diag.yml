name: ESPN diagnostic
on:
  schedule:
    - cron: '10,40 18-23 * * *'
    - cron: '10,40 0-6 * * *'
  workflow_dispatch:
  push:
    paths: ['tools/diag.mjs', '.github/workflows/diag.yml']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/diag.mjs
      - run: |
          git config user.name "nbb-bot"; git config user.email "nbb-bot@users.noreply.github.com"
          mkdir -p out/diag; cp out/diag.json out/diag/$(date -u +%Y%m%dT%H%M).json; git add out; git commit -m "diag $(date -u +%FT%TZ)" && git pull --rebase -q && git push
