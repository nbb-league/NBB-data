name: ESPN reachability test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/espn-test.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try ESPN public league endpoints
        run: |
          mkdir -p out
          : > out/test-result.txt
          for u in \
            "https://lm-api-reads.fantasy.espn.com/apis/v3/games/fba/seasons/2027/segments/0/leagues/948?view=mTeam" \
            "https://lm-api-reads.fantasy.espn.com/apis/v3/games/fba/seasons/2027/segments/0/leagues/948?view=mMatchup&view=mRoster&scoringPeriodId=5" \
            "https://lm-api-reads.fantasy.espn.com/apis/v3/games/fba/seasons/2027/segments/0/leagues/948?view=kona_player_info" ; do
            code=$(curl -s -m 40 -H 'Accept: application/json' -o /tmp/r.json -w '%{http_code}' "$u" || echo curlfail)
            size=$(wc -c < /tmp/r.json 2>/dev/null || echo 0)
            echo "$code $size $u" >> out/test-result.txt
            head -c 200 /tmp/r.json >> out/test-result.txt; echo >> out/test-result.txt
          done
          date -u >> out/test-result.txt
          cat out/test-result.txt
      - name: Save result to repo
        run: |
          git config user.name "nbb-bot"; git config user.email "nbb-bot@users.noreply.github.com"
          git add out/test-result.txt && git commit -m "ESPN reachability test result" && git push || true
