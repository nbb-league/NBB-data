name: ESPN probe
on:
  workflow_dispatch:
  push:
    paths: ['tools/probe.mjs', '.github/workflows/probe.yml']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/probe.mjs
